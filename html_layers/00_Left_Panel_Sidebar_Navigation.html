  <!-- ====================================================== -->
  <!-- STANDALONE LAYER SCRIPTS: sidebar interaction functions -->
  <!-- These mirror index.html so clicks work in isolation     -->
  <!-- ====================================================== -->
  <script>
    // ── Folder accordion toggle ──────────────────────────────
    function toggleFolderAccordion(containerId, chevronId) {
      const container = document.getElementById(containerId);
      const chevron   = document.getElementById(chevronId);
      if (!container) return;
      const isHidden = container.classList.contains('hidden');
      if (isHidden) {
        container.classList.remove('hidden');
        if (chevron) chevron.classList.remove('rotate-180');
      } else {
        container.classList.add('hidden');
        if (chevron) chevron.classList.add('rotate-180');
      }
    }

    // ── All navigable view IDs (mirrors index.html) ──────────
    const ALL_VIEWS = ['home','flowchart','catalog','obe','dashboard',
                       'compliance','delegation','audit','registrar',
                       'syllabus','course','spreadsheet'];

    // ── Navigate to a named view ─────────────────────────────
    function navigateView(viewId) {
      if (!viewId) viewId = 'flowchart';

      // Clear all nav-btn active states
      ALL_VIEWS.forEach(v => {
        const nav = document.getElementById('nav-' + v);
        if (nav) {
          nav.classList.remove('active-nav','bg-[#002855]','text-white','border-l-4','border-[#E5A823]');
          nav.classList.add('text-slate-300');
        }
      });
      // Also clear regdoc buttons when leaving registrar
      if (viewId !== 'registrar') {
        for (let i = 1; i <= 7; i++) {
          const btn = document.getElementById('nav-regdoc-' + i);
          if (btn) {
            btn.classList.remove('active-nav','bg-[#002855]','text-white','border-l-4','border-[#E5A823]','bg-slate-800');
            btn.classList.add('text-slate-300');
          }
        }
      }

      // Highlight the clicked nav button
      const targetNav = document.getElementById('nav-' + viewId);
      if (targetNav) {
        targetNav.classList.add('active-nav','bg-[#002855]','text-white');
        targetNav.classList.remove('text-slate-300');
      }

      // Show toast notification
      showNavToast(viewId);
    }

    // ── Switch registrar doc tab ─────────────────────────────
    function switchRegDoc(tabIdx) {
      // Navigate to registrar view first
      navigateView('registrar');

      // Clear all regdoc buttons
      for (let i = 1; i <= 7; i++) {
        const btn = document.getElementById('nav-regdoc-' + i);
        if (btn) {
          btn.classList.remove('active-nav','bg-[#002855]','text-white','border-l-4','border-[#E5A823]','bg-slate-800');
          btn.classList.add('text-slate-300');
        }
      }
      // Highlight selected regdoc button
      const activeBtn = document.getElementById('nav-regdoc-' + tabIdx);
      if (activeBtn) {
        activeBtn.classList.add('active-nav','bg-[#002855]','text-white','border-l-4','border-[#E5A823]');
        activeBtn.classList.remove('text-slate-300');
      }

      showNavToast('registrar-doc-' + tabIdx);
    }

    // ── Toast helper ─────────────────────────────────────────
    const VIEW_LABELS = {
      home:        'Academic Schools Overview',
      flowchart:   'Curriculum Flowchart',
      spreadsheet: 'Integrated Master Spreadsheet',
      syllabus:    'Syllabus Management System',
      course:      'Course Management System',
      catalog:     'Course Catalog & Directory',
      obe:         'OBE Curriculum Matrix',
      dashboard:   'Curriculum Analytics Dashboard',
      compliance:  'CHED CMO 92 Compliance',
      delegation:  'Governance Cluster Delegation',
      audit:       'Governance Audit Trail',
      registrar:   'Registrar Archive Center',
      'registrar-doc-1': 'Official Flowchart (Sheet 1)',
      'registrar-doc-2': 'Curriculum Prospectus (Sheet 2)',
      'registrar-doc-3': 'Course Catalog (Sheet 3)',
      'registrar-doc-4': 'Program of Study (Sheet 4)',
      'registrar-doc-5': 'OBE Map (Sheet 5)',
      'registrar-doc-6': 'Comparative Summary (Sheet 6)',
      'registrar-doc-7': 'Summary of Units (Sheet 7)',
    };

    function showNavToast(viewId) {
      let toast = document.getElementById('nav-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'nav-toast';
        toast.style.cssText = [
          'position:fixed','bottom:20px','left:50%','transform:translateX(-50%)',
          'background:#002855','color:#E5A823','border:1px solid #E5A823',
          'padding:8px 18px','font-size:11px','font-family:monospace',
          'font-weight:700','letter-spacing:.05em','white-space:nowrap',
          'z-index:9999','pointer-events:none','opacity:0',
          'transition:opacity .25s'
        ].join(';');
        document.body.appendChild(toast);
      }
      const label = VIEW_LABELS[viewId] || viewId;
      toast.textContent = '▶  Navigating to: ' + label;
      toast.style.opacity = '1';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 2400);
    }

    // ── On load: open default folders that were not hidden ───
    // (mirrors the initial expanded state already in HTML via no 'hidden' class)
  </script>
